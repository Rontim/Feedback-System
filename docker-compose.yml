services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedback}
      POSTGRES_USER: ${POSTGRES_USER:-feedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedback}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8067:8025"
      - "1038:1025"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      EMAIL_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "9555:8000"

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:9555
    depends_on:
      - api
    ports:
      - "3025:3000"

volumes:
  pgdata:
