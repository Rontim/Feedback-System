name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the tested main commit to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      deployment_environment: staging
      database_name: feedback_staging
      migration_job: django-migrate-staging
      api_service: feedback-api-staging
      web_service: feedback-web-staging
      api_url: https://feedback-api-staging-nwcj3afvoq-uc.a.run.app
      web_url: https://feedback-web-staging-nwcj3afvoq-uc.a.run.app
      api_host: feedback-api-staging-nwcj3afvoq-uc.a.run.app
      web_host: feedback-web-staging-nwcj3afvoq-uc.a.run.app
    secrets: inherit

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      deployment_environment: production
      database_name: feedback
      migration_job: django-migrate
      api_service: feedback-api
      web_service: feedback-web
      api_url: https://feedback-api-nwcj3afvoq-uc.a.run.app
      web_url: https://feedback-web-nwcj3afvoq-uc.a.run.app
      api_host: feedback-api-nwcj3afvoq-uc.a.run.app
      web_host: feedback-web-nwcj3afvoq-uc.a.run.app
    secrets: inherit
