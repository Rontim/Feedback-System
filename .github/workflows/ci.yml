name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: apps/api/requirements-dev.txt,
          }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 20,
            cache: pnpm,
            cache-dependency-path: apps/web/pnpm-lock.yaml,
          }
      - name: Ruff
        working-directory: apps/api
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: ESLint + typecheck
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: feedback
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedback" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: apps/api/requirements-dev.txt,
          }
      - working-directory: apps/api
        run: pip install -r requirements-dev.txt
      - name: Fail if a migration is missing
        working-directory: apps/api
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        working-directory: apps/api
        run: python -m pytest -q

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 20,
            cache: pnpm,
            cache-dependency-path: apps/web/pnpm-lock.yaml,
          }
      - working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  build:
    needs: [lint, test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with: { context: apps/api, push: false, tags: feedback-api:ci }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: apps/web, push: false, tags: feedback-web:ci }
