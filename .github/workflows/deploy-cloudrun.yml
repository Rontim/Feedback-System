name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: GitHub environment to protect and deploy to
        required: true
        type: string
      database_name:
        description: PostgreSQL database for this deployment
        required: true
        type: string
      migration_job:
        description: Cloud Run migration job name
        required: true
        type: string
      api_service:
        description: Cloud Run API service name
        required: true
        type: string
      web_service:
        description: Cloud Run web service name
        required: true
        type: string
      api_url:
        description: Public URL used by the web API rewrite
        required: true
        type: string
      web_url:
        description: Public dashboard URL
        required: true
        type: string
      api_host:
        description: API hostname allowed by Django
        required: true
        type: string
      web_host:
        description: Web hostname allowed by Django
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deployment_environment }}
      url: ${{ inputs.web_url }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: feedbacksys
      REGION: us-central1
      INSTANCE_CONNECTION_NAME: feedbacksys:us-central1:assessment-db
      DATABASE_NAME: ${{ inputs.database_name }}
      MIGRATION_JOB: ${{ inputs.migration_job }}
      API_SERVICE: ${{ inputs.api_service }}
      WEB_SERVICE: ${{ inputs.web_service }}
      API_URL: ${{ inputs.api_url }}
      WEB_URL: ${{ inputs.web_url }}
      API_HOST: ${{ inputs.api_host }}
      WEB_HOST: ${{ inputs.web_host }}
      API_IMAGE: us-central1-docker.pkg.dev/feedbacksys/feedback-repo/api:${{ github.sha }}
      WEB_IMAGE: us-central1-docker.pkg.dev/feedbacksys/feedback-repo/web:${{ github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Select GCP project
        run: gcloud config set project "$PROJECT_ID"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.API_IMAGE }}

      - name: Run database migrations
        run: |
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --image="$API_IMAGE" \
            --region="$REGION" \
            --set-cloudsql-instances="$INSTANCE_CONNECTION_NAME" \
            --set-secrets="DJANGO_SECRET_KEY=django-secret-key:latest,POSTGRES_PASSWORD=postgres-password:latest" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=$INSTANCE_CONNECTION_NAME,POSTGRES_DB=$DATABASE_NAME,POSTGRES_USER=feedback,POSTGRES_HOST=/cloudsql/$INSTANCE_CONNECTION_NAME,DJANGO_DEBUG=0,DJANGO_ALLOWED_HOSTS=localhost" \
            --command="python" \
            --args="/app/manage.py,migrate" \
            --max-retries=0

          gcloud run jobs execute "$MIGRATION_JOB" --region="$REGION" --wait

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          image: ${{ env.API_IMAGE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          flags: "--allow-unauthenticated --add-cloudsql-instances=${{ env.INSTANCE_CONNECTION_NAME }} --port=8000"
          secrets: |
            DJANGO_SECRET_KEY=django-secret-key:latest
            POSTGRES_PASSWORD=postgres-password:latest
            AT_API_KEY=at-api-key:latest
            AI_API_KEY=ai-api-key:latest
            AI_BASE_URL=ai-base-url:latest
            AI_MODEL=ai-model:latest
            AT_WEBHOOK_TOKEN=at-webhook-token:latest
            AT_SENDER_ID=at-sender-id:latest
            EMAIL_HOST_PASSWORD=email-host-password:latest
            EMAIL_HOST_USER=email-host-user:latest
            DEFAULT_FROM_EMAIL=default-from-email:latest
            CARE_ALERT_FALLBACK_EMAIL=default-from-email:latest
          env_vars: |
            INSTANCE_CONNECTION_NAME=${{ env.INSTANCE_CONNECTION_NAME }}
            POSTGRES_DB=${{ env.DATABASE_NAME }}
            POSTGRES_USER=feedback
            POSTGRES_HOST=/cloudsql/${{ env.INSTANCE_CONNECTION_NAME }}
            DJANGO_DEBUG=0
            DJANGO_ALLOWED_HOSTS=${{ env.API_HOST }},${{ env.WEB_HOST }}
            DJANGO_CSRF_TRUSTED_ORIGINS=${{ env.API_URL }},${{ env.WEB_URL }}
            TIME_ZONE=Africa/Nairobi
            DASHBOARD_URL=${{ env.WEB_URL }}/dashboard
            EMAIL_HOST=smtp.gmail.com
            EMAIL_PORT=587
            EMAIL_USE_TLS=1
            AT_USERNAME=sandbox

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            API_URL=${{ env.API_URL }}

      - name: Deploy web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE }}
          image: ${{ env.WEB_IMAGE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          flags: "--allow-unauthenticated --port=3000"
          env_vars: |
            API_URL=${{ env.API_URL }}
